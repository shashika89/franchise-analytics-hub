name: Python CI Pipeline

# Trigger this workflow every time someone pushes to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # Run this on a fresh, cloud-hosted Ubuntu Linux machine
    runs-on: ubuntu-latest

    steps:
    # 1. Download the code from the repository to the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Python on the cloud machine
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Install dependencies from our project
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi pytest pandas

    # 4. Execute the automated tests
    - name: Run Pytest
      run: |
        python -m pytest